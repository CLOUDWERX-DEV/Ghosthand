name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The exact `ghosthand` command, or the MCP call.
      render: sh
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ghosthand doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ghosthand --version`
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and distro
      description: For example "Hyprland on Fedora 42" or "GNOME on X11, Ubuntu 24.04"
