[package]
name = "ghosthand"
version = "0.4.1"
edition = "2021"
rust-version = "1.74"
description = "Give coding agents your real mouse and keyboard on Linux, behind an allow/deny prompt you control."
license = "MIT"
authors = ["CLOUDWERX LAB <mail@cloudwerxlab.com>"]
repository = "https://github.com/CLOUDWERX-DEV/Ghosthand"
homepage = "https://cloudwerxlab.com"
readme = "README.md"
keywords = ["computer-use", "wayland", "niri", "uinput", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "ghosthand"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
libloading = "0.8"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
