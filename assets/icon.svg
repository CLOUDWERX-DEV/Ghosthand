<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ghosthand">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101734"/>
      <stop offset="1" stop-color="#241b52"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b26bff"/>
      <stop offset="1" stop-color="#3de0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3de0ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3de0ff" stop-opacity="0"/>
    </radialGradient>
    <path id="cursor" d="M0 0 L0 17 L4.5 12.9 L7.8 21 L10.8 19.7 L7.5 11.7 L13 11.7 Z"/>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#glow)"/>
  <rect x="13" y="13" width="230" height="230" rx="57" fill="none" stroke="#3de0ff" stroke-opacity="0.28" stroke-width="2"/>
  <!-- the ghost: where the hand has just been -->
  <use href="#cursor" fill="url(#trail)" fill-opacity="0.14" transform="translate(52 50) scale(6.2)"/>
  <use href="#cursor" fill="url(#trail)" fill-opacity="0.26" transform="translate(70 66) scale(7.1)"/>
  <use href="#cursor" fill="url(#trail)" fill-opacity="0.44" transform="translate(88 82) scale(8)"/>
  <!-- the hand: a real pointer, with the ring Ghosthand draws around it -->
  <circle cx="108" cy="92" r="34" fill="none" stroke="#3de0ff" stroke-width="5" stroke-opacity="0.9"/>
  <circle cx="108" cy="92" r="50" fill="none" stroke="#3de0ff" stroke-width="3" stroke-opacity="0.28"/>
  <use href="#cursor" fill="#f4f7ff" transform="translate(104 86) scale(8.6)"/>
  <!-- the tag: "Agent Control", always beside it -->
  <rect x="138" y="178" width="92" height="32" rx="16" fill="#0e1427" stroke="#3de0ff" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="157" cy="194" r="6" fill="#3de0ff"/>
  <rect x="172" y="189" width="46" height="10" rx="5" fill="#e6ecf7" fill-opacity="0.9"/>
</svg>
