<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1a1a45"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3de0ff"/>
      <stop offset="1" stop-color="#b26bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3de0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="28" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="27.5" fill="none" stroke="#3de0ff" stroke-opacity="0.22"/>
  <image href="../icon.svg" x="64" y="40" width="220" height="220"/>
  <text x="316" y="152" font-family="Inter, 'Inter Variable', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="98" letter-spacing="-3">
    <tspan font-weight="300" fill="#e6ecf7">ghost</tspan><tspan font-weight="800" fill="url(#word)">hand</tspan>
  </text>
  <text x="320" y="206" font-family="Inter, 'Inter Variable', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24.5" font-weight="400" fill="#a9b3c8">A real hand on a real pointer, with a gate in front of it.</text>
</svg>
