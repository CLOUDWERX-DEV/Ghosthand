<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171a3f"/></linearGradient>
    <path id="cursor" d="M0 0 L0 17 L4.5 12.9 L7.8 21 L10.8 19.7 L7.5 11.7 L13 11.7 Z"/>
  </defs>
  <style>
    text { font-family: Inter, 'Inter Variable', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .code { font-family: 'JetBrains Mono', 'JetBrainsMono Nerd Font Mono', Consolas, monospace; font-size: 15px; fill: #3b4666; }
  </style>
  <rect width="960" height="420" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="21.5" fill="none" stroke="#3de0ff" stroke-opacity="0.2"/>
  <!-- a quiet desktop behind -->
  <text class="code" x="40" y="250">$ cargo test --release</text>
  <text class="code" x="40" y="276">   Compiling myapp v0.4.1</text>
  <text class="code" x="40" y="302">    Finished test profile</text>
  <text class="code" x="40" y="328">test result: ok. 41 passed</text>
  <text class="code" x="560" y="372">$ ghosthand status</text>
  <!-- 1. the card -->
  <g transform="translate(250 34)">
    <rect width="460" height="150" rx="16" fill="#0e121b" fill-opacity="0.94" stroke="#3de0ff" stroke-opacity="0.55"/>
    <rect x="16" y="0" width="300" height="3" rx="1.5" fill="#3de0ff"/>
    <circle cx="40" cy="44" r="20" fill="#3de0ff" fill-opacity="0.16"/>
    <use href="#cursor" fill="#3de0ff" transform="translate(32 33) scale(0.95)"/>
    <text x="74" y="42" font-size="16" font-weight="600" fill="#e6ecf7">Claude wants to use your mouse</text>
    <text x="74" y="64" font-size="12.5" fill="#a9b3c8">Checking the Tabs panel after the layout change</text>
    <text x="74" y="82" font-size="12.5" fill="#a9b3c8">Nothing moves until you allow it (5 s).</text>
    <rect x="16" y="104" width="64" height="32" rx="9" fill="#252c3d"/>
    <text x="48" y="124" font-size="13" fill="#e6ecf7" text-anchor="middle">Deny</text>
    <rect x="236" y="104" width="130" height="32" rx="9" fill="#252c3d"/>
    <text x="301" y="124" font-size="13" fill="#e6ecf7" text-anchor="middle">Allow for 10 min</text>
    <rect x="376" y="104" width="68" height="32" rx="9" fill="#3de0ff"/>
    <text x="410" y="124" font-size="13" font-weight="600" fill="#04121a" text-anchor="middle">Allow</text>
  </g>
  <!-- 2. the tag and the ring -->
  <g transform="translate(690 230)">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#3de0ff" stroke-width="2" stroke-opacity="0.85"/>
    <use href="#cursor" fill="#f4f7ff" transform="translate(-3 -3) scale(1.25)"/>
    <rect x="22" y="22" width="132" height="28" rx="14" fill="#0e121b" fill-opacity="0.95" stroke="#3de0ff" stroke-opacity="0.65"/>
    <circle cx="38" cy="36" r="4" fill="#3de0ff"/>
    <text x="50" y="40.5" font-size="12.5" font-weight="600" fill="#e6ecf7">Agent Control</text>
  </g>
  <text x="250" y="214" font-size="13" fill="#7f8aa6">1. A card asks first. No answer is a no.</text>
  <text x="560" y="300" font-size="13" fill="#7f8aa6">2. A tag and a ring follow the cursor while it moves.</text>
  <text x="250" y="392" font-size="13" fill="#7f8aa6">3. One key takes the pointer back, any time.</text>
</svg>
