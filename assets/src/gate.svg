  <text x="250" y="214" font-size="13" fill="#7f8aa6">1. A card asks first. No answer is a no.</text>
  <text x="560" y="300" font-size="13" fill="#7f8aa6">2. A tag and a ring follow the cursor while it moves.</text>
  <text x="250" y="392" font-size="13" fill="#7f8aa6">3. One key takes the pointer back, any time.</text>
