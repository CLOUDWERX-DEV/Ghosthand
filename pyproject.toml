[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosthand"
dynamic = ["version"]
description = "A real hand on a real pointer for coding agents on Wayland (niri first), with an allow/deny gate and a cursor tag in front of it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CLOUDWERX LAB", email = "mail@cloudwerxlab.com" }]
keywords = ["computer-use", "wayland", "niri", "uinput", "mcp", "automation", "quickshell", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://cloudwerxlab.com"
Changelog = "https://github.com/CLOUDWERX-DEV/ghosthand/blob/main/CHANGELOG.md"

[project.scripts]
ghosthand = "ghosthand.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ghosthand.__version__" }

[tool.setuptools.packages.find]
include = ["ghosthand*"]

[tool.setuptools.package-data]
ghosthand = ["overlay/*.qml", "overlay/qmldir"]
